<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Xamana</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <h:outputStylesheet name="jquery-ui.css"/>
        <h:outputStylesheet name="jquery-ui.theme.css"/>
        <h:outputStylesheet name="jquery-ui.theme.min.css"/>
        <h:outputStylesheet name="jquery-ui.min.css"/>
        <h:outputStylesheet name="jquery-ui.structure.css"/>
        <h:outputStylesheet name="jquery-ui.structure.min.css"/>
        <h:outputStylesheet name="style.css"/>
    </h:head>
    <h:body style="background-color: #3f3f3f">
        <header>
            <text>Scheme</text>
        </header>
        <h:form id="f9">
            <p:dataTable value="#{bd.obj.HD.fragments}" var="item">
                <p:column headerText="Nombre">
                    <h:outputText value="#{item.nombre}" />
                </p:column>
                <p:column headerText="Predicado">
                    <h:outputText value="#{item.predicado}"/>
                </p:column>
                <p:column headerText="Atributos">
                    <h:outputText value="#{item.atributosMostrar}" />
                </p:column>
                <p:column headerText="Sitio horizontal">
                    <h:outputText value="#{item.sitioh}" />
                </p:column>
                <p:column headerText="Sitio vertical">
                    <h:outputText value="#{item.sitiov}" />
                </p:column>
            </p:dataTable>
            <p:dialog id="dHybrid" header="Header" visible="#{bd.DHybrid}" minHeight="40" width="350" showEffect="fade">
                <h:outputText value="#{bd.obj.sentencia}" />
                <p:commandButton value="OK" icon="pi-thumbs-up" action="#{bd.okHybrid()}" update="dHybrid" />
            </p:dialog>
        </h:form>
    </h:body>
</html>
