<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core" 
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <h:head>
        <title>Xamana</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <h:outputStylesheet name="jquery-ui.css"/>
        <h:outputStylesheet name="jquery-ui.theme.css"/>
        <h:outputStylesheet name="jquery-ui.theme.min.css"/>
        <h:outputStylesheet name="jquery-ui.min.css"/>
        <h:outputStylesheet name="jquery-ui.structure.css"/>
        <h:outputStylesheet name="jquery-ui.structure.min.css"/>
        <h:outputStylesheet name="style.css"/>
        <script type="text/javascript">
            //<![CDATA[
            function start2() {
                PF('statusDialog').show();
            }

            function stop2() {
                PF('statusDialog').hide();
            }
            function start() {
                PF('startButton1').disable();

                window['progress'] = setInterval(function () {
                    var pbClient = PF('pbClient'),
                            oldValue = pbClient.getValue(),
                            newValue = oldValue + 10;

                    pbClient.setValue(pbClient.getValue() + 10);

                    if (newValue === 100) {
                        clearInterval(window['progress']);
                    }


                }, 1000);
            }

            function cancel() {
                clearInterval(window['progress']);
                PF('pbClient').setValue(0);
                PF('startButton1').enable();
            }
            //]]>
        </script>
    </h:head>
    <h:body style="background-color: #3f3f3f">
        <header>
            <text>Esquema</text>
        </header>

        <h:form id="dh2">
            <p:growl id="growl" showDetail="true" sticky="true"  />

            <p:dataTable value="#{bd.horizontalMongo.esquema}" var="t">
                <p:column headerText="Fragmento">
                    <h:outputText value="#{t.name}" />
                </p:column>
                <p:column headerText="Predicado">
                    <h:outputText value="#{t.predicate}" />
                </p:column>

                <p:column headerText="Sitio">
                    <h:outputText value="#{t.site}" />
                </p:column>
                <p:column headerText="Número de tuplas">
                    <h:outputText value="#{t.tuples}" />
                </p:column>
                <p:column headerText="Valor de desempeño">
                    <h:outputText value="#{t.performance}" />
                </p:column>
            </p:dataTable>
            <br />
            <p:progressBar widgetVar="pbAjax" ajax="true" value="#{bd.obj.progress1}" labelTemplate="{value}%" styleClass="animated" global="false">
                <p:ajax event="complete" listener="#{bd.onComplete}" update="dh2:growl" oncomplete="PF('startButton2').enable()"/>
            </p:progressBar>
            <br/>
            <p:commandButton widgetVar="startButton2" value="Let's do it" onclick="PF('pbAjax').start();PF('startButton2').disable();" action="#{bd.fragEstatica()}" update="dh2:growl" />
        </h:form>
    </h:body>
</html>
