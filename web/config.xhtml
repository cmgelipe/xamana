<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Xamana</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <h:outputStylesheet name="jquery-ui.css"/>
        <h:outputStylesheet name="jquery-ui.theme.css"/>
        <h:outputStylesheet name="jquery-ui.theme.min.css"/>
        <h:outputStylesheet name="jquery-ui.min.css"/>
        <h:outputStylesheet name="jquery-ui.structure.css"/>
        <h:outputStylesheet name="jquery-ui.structure.min.css"/>
        <h:outputStylesheet name="style.css"/>
    </h:head>
    <h:body style="background-color: #3f3f3f">
        <header>
            <text>Configuración</text>
        </header>
        <h:form id="f3" enctype="multipart/form-data" style="text-align: center">
            <div style="text-align: center">
                <p:panelGrid  columns="2" style="margin: 0 auto; border: none">
                    <p:outputLabel value="Tipo de fragmentación" />
                    <p:selectOneMenu value="#{bd.obj.tabla.tipoFragment}">
                        <p:ajax update="f3:sino" />
                        <f:selectItem itemLabel="Selecciona una opción" noSelectionOption="true" />
                        <f:selectItem itemLabel="Horizontal" itemValue="a" />
                        <f:selectItem itemLabel="Vertical" itemValue="b" />
                        <f:selectItem itemLabel="Híbrida" itemValue="c" />
                    </p:selectOneMenu>
                    <p:outputLabel value="CBIR" />
                    <p:selectBooleanButton id="sino" value="#{bd.obj.tabla.CBIR}" onLabel="Si" offLabel="No" >
                        <p:ajax listener="#{bd.onCBIRchange}" update="f3:file f3:o1 f3:dl4 f3:atb" />
                    </p:selectBooleanButton>
                    <p:outputLabel id="o1" value="Archivos log" />
                    <p:fileUpload id="file" value="#{bd.files}" mode="simple" skinSimple="true" multiple="true" />
                    
                    <p:outputLabel value="Umbral de operaciones" />
                    <h:outputText id="output1" value="%#{bd.obj.tabla.umbralOP}" />
                    <h:inputHidden id="s1" value="#{bd.obj.tabla.umbralOP}" />
                    <p:slider for="s1" display="output1" style="width: 200px" displayTemplate="%{value}" minValue="-100.0" maxValue="100.0"/>
                    
                    <p:outputLabel value="Umbral de costo" />
                    <h:outputText id="output2" value="%#{bd.obj.tabla.umbralCO}" />
                    <h:inputHidden id="s2" value="#{bd.obj.tabla.umbralCO}" />
                    <p:slider for="s2" display="output2" style="width: 200px" displayTemplate="%{value}" minValue="-100.0" maxValue="100.0" />
                    
                </p:panelGrid>
                <br />
                <p:commandButton ajax="false" value="Generar esquema" action="#{bd.btnesquema()}" />
            </div>
            <p:dialog id="dl4" header="Detalles del atributo multimedia" modal="true" visible="#{bd.dcolumna}">
                <p:outputLabel value="Atributo descriptor (mesa, silla, edificio, etc.)" /><br />
                <p:selectOneMenu id="atb" value="#{bd.obj.tabla.atributoMultimedia}">
                    <f:selectItems value="#{bd.atributos}" />
                </p:selectOneMenu><br />
                <p:commandButton value="Establecer" action="#{bd.esquemaCBIRHorizontal()}" update="f3:dl4"/>
            </p:dialog>
            <p:ajaxStatus onstart="PF('statusDialog').show()" onsuccess="PF('statusDialog').hide()"/>

            <p:dialog width="20%" widgetVar="statusDialog" modal="true" draggable="false" closable="false" resizable="false" showHeader="false">
                <h:graphicImage style="margin-left:10%" name="images/load.gif" width="20%"/>
            </p:dialog>
        </h:form>
    </h:body>
</html>
