<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Xamana</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <h:outputStylesheet name="jquery-ui.css"/>
        <h:outputStylesheet name="jquery-ui.theme.css"/>
        <h:outputStylesheet name="jquery-ui.theme.min.css"/>
        <h:outputStylesheet name="jquery-ui.min.css"/>
        <h:outputStylesheet name="jquery-ui.structure.css"/>
        <h:outputStylesheet name="jquery-ui.structure.min.css"/>
        <h:outputStylesheet name="style.css"/>
    </h:head>
    <h:body style="background-color: #3f3f3f">
        <h:form id="f3" enctype="multipart/form-data" style="text-align: center">
            <p:growl id="mensajes"  showDetail="true" />
            <header>
                <text>Configuration</text>
                <!--<p:commandButton action="#{bd.confNuevoFrag()}" style="width: 20%; position: absolute; left: 15px; top: 22px; font-size: 17px;" value="Agregar nuevos fragmentos" />
                <p:commandButton style="width: 20%; position: absolute; right: 15px; top:22px; font-size: 17px;" value="Eliminar fragmentos" />-->
            </header>
            <div style="text-align: center">
                <p:panelGrid  columns="2" style="margin: 0 auto; border: none">
                    <p:outputLabel value="Fragmentation type" />
                    <p:selectOneMenu value="#{bd.obj.tabla.tipoFragment}">
                        <p:ajax update="f3:sino" />
                        <p:ajax listener="#{bd.onTipoFragmentchange}" update="f3:dtamanios" />
                        <f:selectItem itemLabel="Select an option" noSelectionOption="true" />
                        <f:selectItem itemLabel="Horizontal" itemValue="a" />
                        <f:selectItem itemLabel="Vertical" itemValue="b" />
                        <f:selectItem itemLabel="Hybrid" itemValue="c" />
                    </p:selectOneMenu>
                    <p:outputLabel value="CBIR" />
                    <p:selectBooleanButton id="sino" value="#{bd.obj.tabla.CBIR}" onLabel="Yes" offLabel="No" >
                        <p:ajax listener="#{bd.onCBIRchange}" update="f3:file f3:o1 f3:dl4 f3:atb f3:dl5 f3:dtamanios" />
                    </p:selectBooleanButton>
                    <p:outputLabel id="o1" value="Log files" />
                    <p:fileUpload id="file" value="#{bd.files}" mode="simple" skinSimple="true" multiple="true" />

                    <p:outputLabel value="Operation threshold" />
                    <h:outputText id="output1" value="%#{bd.obj.tabla.umbralOP}" />
                    <h:inputHidden id="s1" value="#{bd.obj.tabla.umbralOP}" />
                    <p:slider for="s1" display="output1" style="width: 200px" displayTemplate="{value}%" minValue="0.0" maxValue="100.0" step="0.1"/>

                    <p:outputLabel value="Performance threshold" />
                    <h:outputText id="output2" value="%#{bd.obj.tabla.umbralCO}" />
                    <h:inputHidden id="s2" value="#{bd.obj.tabla.umbralCO}" />
                    <p:slider for="s2" display="output2" style="width: 200px" displayTemplate="{value}%" minValue="0.0" maxValue="100.0" step="0.1"/>

                </p:panelGrid>
                <br />
                <p:commandButton ajax="false" value="Generate schema" action="#{bd.btnesquema()}" />
            </div>
            <p:dialog id="dl4" header="Multimedia attribute details" modal="true" visible="#{bd.dcolumna}">
                <p:outputLabel value="Descriptor attribute (table, chair, building, etc.)" /><br />
                <p:selectOneMenu id="atb" value="#{bd.obj.tabla.atributoMultimedia}">
                    <f:selectItems value="#{bd.atributos}" />
                </p:selectOneMenu><br />
                <p:commandButton value="Set" action="#{bd.esquemaCBIRHorizontal()}" update="f3:dl4"/>
            </p:dialog>
            <p:dialog id="dl5" header="Multimedia attributes" modal="true" visible="#{bd.dcolumnas}">
                <p:panelGrid>
                    <f:facet name="header">
                        <p:row>
                            <p:column>Multimedia atributte</p:column>
                            <p:column>Descriptor atributte</p:column>
                            <p:column>Selections</p:column>
                        </p:row>
                    </f:facet>
                    <p:row>
                        <p:column>
                            <p:selectOneListbox id="s5" value="#{bd.seleccion1}"  >
                                <f:selectItems id="s7" value="#{bd.obj.tabla.atributos}" var="l" itemLabel="#{l.nombre}" itemValue="#{l.nombre}"/> 
                            </p:selectOneListbox>
                        </p:column>
                        <p:column>
                            <p:selectOneListbox id="s4" value="#{bd.seleccion2}">
                                <f:selectItems id="s6" value="#{bd.obj.tabla.atributos}" var="m" itemLabel="#{m.nombre}" itemValue="#{m.nombre}"/> 
                            </p:selectOneListbox>
                        </p:column>
                        <p:column>
                            <p:selectOneListbox id="listaAtts" value="#{bd.seleccion3}">
                                <f:selectItems id="s3" value="#{bd.attsMultimediaDescriptor}" var="n" itemLabel="#{n}" itemValue="#{n}" /> 
                            </p:selectOneListbox>
                        </p:column>
                    </p:row>
                    <p:row>
                        <p:column></p:column>
                        <p:column>
                            <p:commandButton id="s8" value="Add" action="#{bd.agregarAtts()}" update="f3:listaAtts f3:mensajes" />
                        </p:column>
                        <p:column>
                            <p:commandButton id="s9" value="Delete" action="#{bd.eliminarAtts()}" update="f3:listaAtts" />
                        </p:column>
                    </p:row>
                </p:panelGrid>
                <p:commandButton value="Set" action="#{bd.esquemaCBIRVertical()}" update="f3:dl5 f3:mensajes"/>
            </p:dialog>
            <p:dialog width="50%" id="dtamanios" header="Size of attributes" modal="true" visible="#{bd.dtamanios}">
                <h:outputText value="In MongoDB, no size limits are defined on data types, as long as each document does not exceed 16 MB.  Define the limits of each attribute."/>
                <p:dataTable value="#{bd.obj.tabla.atributos}" var="y">
                    <p:column>
                        <h:outputText value="#{y.nombre}"/>
                    </p:column>
                    <p:column>
                        <h:outputText value="#{y.tipo}"/>
                    </p:column>
                    <p:column>
                        <p:inputNumber value="#{y.tamanio}" />
                    </p:column>
                </p:dataTable>
                <p:commandButton value="Continue settings" action="#{bd.seleccionAtributos()}" update="f3:dtamanios f3:mensajes f3:dl5" />
                <p:commandButton value="Cancel" action="#{bd.cancelarDTamanios()}" update="f3:dtamanios f3:sino" />
            </p:dialog>
            <p:ajaxStatus onstart="PF('statusDialog').show()" onsuccess="PF('statusDialog').hide()"/>

            <p:dialog width="20%" widgetVar="statusDialog" modal="true" draggable="false" closable="false" resizable="false" showHeader="false">
                <h:graphicImage style="margin-left:10%" name="images/load.gif" width="20%"/>
            </p:dialog>
        </h:form>
    </h:body>
</html>
