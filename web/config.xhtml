<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>xamana</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <h:outputStylesheet name="style.css"/>
    </h:head>
    <h:body>
        <h:form id="f1"enctype="multipart/form-data">
            <p:panelGrid columns="2">
                <p:outputLabel value="Tipo de fragmentación" />
                <p:selectOneMenu value="#{bd.obj.tabla.tipoFragment}">
                    <f:selectItem itemLabel="Selecciona una opción" noSelectionOption="true" />
                    <f:selectItem itemLabel="Horizontal" itemValue="a" />
                    <f:selectItem itemLabel="Vertical" itemValue="b" />
                    <f:selectItem itemLabel="Híbrida" itemValue="c" />
                </p:selectOneMenu>
                <p:outputLabel value="CBIR" />
                <p:selectBooleanButton value="#{bd.obj.tabla.CBIR}" onLabel="Si" offLabel="No" />
                <p:outputLabel value="Archivos log" />
                <p:fileUpload value="#{bd.files}" mode="simple" skinSimple="true" multiple="true" />
            </p:panelGrid>
        </h:form>
    </h:body>
</html>
