<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Xamana</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <h:outputStylesheet name="jquery-ui.css"/>
        <h:outputStylesheet name="jquery-ui.theme.css"/>
        <h:outputStylesheet name="jquery-ui.theme.min.css"/>
        <h:outputStylesheet name="jquery-ui.min.css"/>
        <h:outputStylesheet name="jquery-ui.structure.css"/>
        <h:outputStylesheet name="jquery-ui.structure.min.css"/>
        <h:outputStylesheet name="style.css"/>
        <script type="text/javascript">
            //<![CDATA[
            function start2() {
                PF('statusDialog').show();
            }

            function stop2() {
                PF('statusDialog').hide();
            }
            function start() {
                PF('startButton1').disable();

                window['progress'] = setInterval(function () {
                    var pbClient = PF('pbClient'),
                            oldValue = pbClient.getValue(),
                            newValue = oldValue + 10;

                    pbClient.setValue(pbClient.getValue() + 10);

                    if (newValue === 100) {
                        clearInterval(window['progress']);
                    }


                }, 1000);
            }

            function cancel() {
                clearInterval(window['progress']);
                PF('pbClient').setValue(0);
                PF('startButton1').enable();
            }
            //]]>
        </script>
    </h:head>
    <h:body style="background-color: #3f3f3f">
        <h:form id="f5">
            <header>
                <text>Scheme</text>
            </header>
            <p:growl id="growl" showDetail="true" sticky="true"  />
            <p:dataTable value="#{bd.esquemaVerticalCBIR}" var="x">
                <p:column headerText="Fragment name">
                    <h:outputText value="#{x.nombre}" />
                </p:column>
                <p:column headerText="Site">
                    <h:outputText value="#{x.sitio}" />
                </p:column>
                <p:column headerText="Atributtes">
                    <h:outputText value="#{x.atributos}" />
                </p:column>
                <p:column headerText="Cost">
                    <h:outputText value="#{x.costo}" />
                </p:column>
                
            </p:dataTable>
            <p:progressBar widgetVar="pbAjax" ajax="true" value="#{bd.obj.progress1}" labelTemplate="{value}%" styleClass="animated" global="false">
                <p:ajax event="complete" listener="#{bd.onComplete}" update="f5:growl" oncomplete="PF('startButton2').enable()"/>
            </p:progressBar>
            <p:commandButton widgetVar="startButton2" value="Let's do it" onclick="PF('pbAjax').start();PF('startButton2').disable();" action="#{bd.fragEstatica()}" update="f5:growl f5:d6" />
            <p:dialog id="d6" visible="false" header="Token">
                <h:outputText value="La fragmentación dinámica de este tipo requiere ejecutar el jar en cada nodo de la red" /><br />
            </p:dialog>
        </h:form>
    </h:body>
</html>
