<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>TODO supply a title</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <h:outputStylesheet name="jquery-ui.css"/>
        <h:outputStylesheet name="jquery-ui.theme.css"/>
        <h:outputStylesheet name="jquery-ui.theme.min.css"/>
        <h:outputStylesheet name="jquery-ui.min.css"/>
        <h:outputStylesheet name="jquery-ui.structure.css"/>
        <h:outputStylesheet name="jquery-ui.structure.min.css"/>
        <h:outputStylesheet name="style.css"/>
        <script type="text/javascript">
            //<![CDATA[
            function start() {
                PF('statusDialog').show();
            }

            function stop() {
                PF('statusDialog').hide();
            }
            //]]>
        </script>
    </h:head>
    <h:body style="background-color: #3f3f3f">
        <header>
            <text>Esquema</text>
        </header>
        <h:form id="f4">
            <p:dataTable value="#{bd.valoresColumna}" var="t" rendered="#{bd.obj.horizontalCBIR}">
                <p:column headerText="Nombre de fragmento">
                    <h:outputText value="#{t.nombre}" />
                </p:column>
                <p:column headerText="Conjunto">
                    <h:outputText value="#{t.valor}" />
                </p:column>
                <p:column headerText="Número de tuplas">
                    <h:outputText value="#{t.NTuplas}" />
                </p:column>
                <p:column headerText="Porcentaje">
                    <h:outputText value="#{t.porcentaje}" />
                </p:column>
                <p:column headerText="Operaciones aproximadas">
                    <h:outputText value="#{t.NOperacionesAprox}" />
                </p:column>
            </p:dataTable>
            <p:commandButton value="Hagámoslo" action="#{bd.fragEstatica()}" />
            <p:commandButton value="Descargar archivos" ajax="false" onclick="PrimeFaces.monitorDownload(start, stop);" icon="pi pi-arrow-down" >
                <p:fileDownload value="#{bd.descarga}" />
            </p:commandButton>
            <p:dialog id="d5" header="Información" visible="#{bd.infoEsquema1}" modal="true" closable="false">
                <h:outputText value="Se muestra el primer diseño del esquema propuesto, al aplicarlo se deberán descargar todos los archivos correspondientes"/><br />
                <h:outputText value="para aplicar la fragmentación dinámica. La descarga la acompaña un archivo con las instrucciones a seguir." /><br />
                <p:commandButton value="OK" action="#{bd.setInfoEsquema1(false)}" update="f4:d5" />
            </p:dialog>
        </h:form>
    </h:body>
</html>
