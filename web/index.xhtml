<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Xamana</title>
        <h:outputStylesheet name="jquery-ui.css"/>
        <h:outputStylesheet name="jquery-ui.theme.css"/>
        <h:outputStylesheet name="jquery-ui.theme.min.css"/>
        <h:outputStylesheet name="jquery-ui.min.css"/>
        <h:outputStylesheet name="jquery-ui.structure.css"/>
        <h:outputStylesheet name="jquery-ui.structure.min.css"/>
        <style type="text/css">
            .loading-icon {
                font-size: 3rem;

            }
        </style>
    </h:head>
    <h:body style="background-color: #3f3f3f">
        <h:form id="f1">
            <br /><br /><br /><br /><br /><br /><br /><br /><br /><br />
            <div style="text-align: center">
                <h:graphicImage name="text12.png"  width="35%"/><br />
                <p:selectOneMenu value="#{bd.obj.tipoBD}" >
                    <f:selectItem itemLabel="Select your DBMS" itemValue="" noSelectionOption="true" />
                    <f:selectItem itemLabel="MySQL" itemValue="a" />
                    <f:selectItem itemLabel="Postgres-XL" itemValue="b" />
                    <f:selectItem itemLabel="PostgreSQL" itemValue="c" />
                    <f:selectItem itemLabel="MongoDB" itemValue="d" />
                </p:selectOneMenu><br/>
                <br />
                <p:commandButton ajax="false" value="Connection" action="#{bd.configuracion()}" update="f2:d1" />
            </div>
        </h:form>
        <h:form id="f2">
            <p:growl id="mensajes"  showDetail="true" />
            <h:inputHidden value="#{bd.obj.tipoBD}" />
            <p:dialog header="Configure connection" id="d1" visible="#{bd.bconfig}" modal="true" closable="false" resizable="false">
                <p:panelGrid columns="2">

                    <p:outputLabel value="Database IP" />
                    <p:inputText value="#{bd.obj.dirbd}" placeholder="#.#.#.#" required="true">
                        <p:ajax listener="#{bd.obj.onTablas}" update="f2:tb"/>
                    </p:inputText>
                    <p:outputLabel value="Database port" />
                    <p:inputText value="#{bd.obj.portbd}" required="true">
                        <p:ajax listener="#{bd.obj.onTablas}" update="f2:tb"/>
                    </p:inputText>
                    <p:outputLabel value="Database name" />
                    <p:inputText value="#{bd.obj.nombd}" required="true">
                        <p:ajax listener="#{bd.obj.onTablas}" update="f2:tb"/>
                    </p:inputText>
                    <p:outputLabel value="Database administrator user" />
                    <p:inputText value="#{bd.obj.usubd}" title="Para MongoDB, si la autenticación esta deshabilitada, este campo y el siguiente no son obligatorios">
                        <p:ajax listener="#{bd.obj.onTablas}" update="f2:tb"/>
                    </p:inputText>
                    <p:outputLabel value="Password"/>
                    <p:inputText value="#{bd.obj.passbd}" title="Si la base de datos no tiene contraseña, este campo no es obligatorio" >
                        <p:ajax listener="#{bd.obj.onTablas}" update="f2:tb"/>
                    </p:inputText>
                    <p:outputLabel value="Name of the table to fragment" />
                    <p:selectOneMenu id="tb" value="#{bd.obj.tabla.nombre}" rendered="true">
                        <f:selectItems value="#{bd.obj.tablas}"/>
                    </p:selectOneMenu>         
                </p:panelGrid>
                <p:commandButton value="Test connection" action="#{bd.probarConexion()}" update="f2:dl2 f2:d1 f2:dl3 f2:mensajes"/>
                <p:commandButton value="Cancel"  action="#{bd.cancelarConf()}" update="f2:d1"/>
            </p:dialog>
            <p:dialog id="dl2" header="Information" visible="#{bd.bbotonfragmentar}" modal="true">
                <h:outputText value="The connection was successful, now you will configure" /><br />
                <h:outputText value="details to carry out fragmentation." /><br /><br />
                <p:commandButton ajax="false" value="Configure fragmentation" action="#{bd.configurarFragmentacion()}" update="f2:dl2" />
            </p:dialog>
            <p:dialog id="dl3" header="Information" visible="#{bd.bdatosincorrectos}" modal="true">
                <h:outputText value="The connection was not successful. Check your details."/><br /><br />
                <p:commandButton value="Take a look" action="#{bd.revisarDatos()}" update="f2:dl3" />
            </p:dialog>
            <p:ajaxStatus onstart="PF('statusDialog').show()" onerror="PF('statusDialog').hide()" onsuccess="PF('statusDialog').hide()"/>

            <p:dialog width="20%" widgetVar="statusDialog" modal="true" draggable="false" closable="false" resizable="false" showHeader="false">
                <h:graphicImage style="margin-left: 40%" name="images/load.gif" width="20%"/>
            </p:dialog>
        </h:form>
        <br />
    </h:body>
</html>
