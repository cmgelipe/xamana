<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Xamana</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <h:outputStylesheet name="jquery-ui.css"/>
        <h:outputStylesheet name="jquery-ui.theme.css"/>
        <h:outputStylesheet name="jquery-ui.theme.min.css"/>
        <h:outputStylesheet name="jquery-ui.min.css"/>
        <h:outputStylesheet name="jquery-ui.structure.css"/>
        <h:outputStylesheet name="jquery-ui.structure.min.css"/>
        <h:outputStylesheet name="style.css"/>
    </h:head>
    <h:body style="background-color: #3f3f3f">
        <header>
            <text>Scheme</text>
        </header>
        <h:form id="f9">
            <p:growl id="growl" showDetail="true" sticky="true"  />
            <p:dataTable value="#{bd.obj.HDC.fragments}" var="item">
                <p:column headerText="Nombre">
                    <h:outputText value="#{item.nombre}" />
                </p:column>
                <p:column headerText="Predicado con traslape">
                    <h:outputText value="#{item.predicado}"/>
                </p:column>
                <p:column headerText="Atributos">
                    <h:outputText value="#{item.atributosMostrar}" />
                </p:column>
                <p:column headerText="Sitio horizontal">
                    <h:outputText value="#{item.sitioh}" />
                </p:column>
                <p:column headerText="Sitio vertical">
                    <h:outputText value="#{item.sitiov}" />
                </p:column>
                <p:column headerText="Costo vertical">
                    <h:outputText value="#{item.costoDesV}" />
                </p:column>
                <p:column headerText="Costo horizontal">
                    <h:outputText value="#{item.costoDesH}" />
                </p:column>
            </p:dataTable><br />
            <p:panelGrid>
                <p:row>
                    <p:column>
                        <h:outputText value="Costo HV: #{bd.obj.HD.HVCost}" />
                    </p:column>
                </p:row>
                <p:row>
                    <p:column>
                        <h:outputText value="Costo VH: #{bd.obj.HD.VHCost}" />
                    </p:column>
                </p:row>
            </p:panelGrid>

            <p:progressBar widgetVar="pbAjax" ajax="true" value="#{bd.obj.HD.progress1}" labelTemplate="{value}%" styleClass="animated" global="false">
                <p:ajax event="complete" listener="#{bd.onComplete}" update="f9:growl" oncomplete="PF('startButton2').enable()"/>
            </p:progressBar>
            <br/>
            <p:commandButton widgetVar="startButton2" value="Let's do it" onclick="PF('pbAjax').start();PF('startButton2').disable();" action="#{bd.fragEstatica()}" update="f9:growl f9:d6" />
            <p:dialog id="d6" visible="#{bd.BToken}" header="Token">
                <h:outputText value="Dynamic fragmentation of this kind requires to be implemented in Java with the download files and to use this token" /><br />
                <p:inputText readonly="true" value="#{bd.obj.tabla.idTabla}" />
            </p:dialog>

            <p:dialog id="dHybrid" header="Esquema menos costoso" visible="#{bd.DHybrid}" minHeight="40" width="350" showEffect="fade">
                <h:outputText value="#{bd.obj.sentencia}" /><br />
                <p:commandButton value="OK" icon="pi pi-thumbs-up-fill" action="#{bd.okHybrid()}" update="dHybrid" />
            </p:dialog>

        </h:form>
    </h:body>
</html>
