<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Xamana</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <h:outputStylesheet name="jquery-ui.css"/>
        <h:outputStylesheet name="jquery-ui.theme.css"/>
        <h:outputStylesheet name="jquery-ui.theme.min.css"/>
        <h:outputStylesheet name="jquery-ui.min.css"/>
        <h:outputStylesheet name="jquery-ui.structure.css"/>
        <h:outputStylesheet name="jquery-ui.structure.min.css"/>
        <h:outputStylesheet name="style.css"/>
        <script type="text/javascript">
            //<![CDATA[
            function start2() {
                PF('statusDialog').show();
            }

            function stop2() {
                PF('statusDialog').hide();
            }
            function start() {
                PF('startButton1').disable();

                window['progress'] = setInterval(function () {
                    var pbClient = PF('pbClient'),
                            oldValue = pbClient.getValue(),
                            newValue = oldValue + 10;

                    pbClient.setValue(pbClient.getValue() + 10);

                    if (newValue === 100) {
                        clearInterval(window['progress']);
                    }


                }, 1000);
            }

            function cancel() {
                clearInterval(window['progress']);
                PF('pbClient').setValue(0);
                PF('startButton1').enable();
            }
            //]]>
        </script>
    </h:head>
    <h:body style="background-color: #3f3f3f">
        <header>
            <text>Scheme</text>
        </header>
        <h:form id="f8">
            <p:growl id="growl" showDetail="true" sticky="true"  />
            <p:tabView id="tabView">
                <p:tab title="Costos"><!-- Costo de cada atributo por cada sitio -->
                    <p:panelGrid>
                        <p:row>
                            <p:column style="width: 10%">
                                <p:dataTable value="#{bd.obj.tabla.atributos}" var="u">
                                    <f:facet name="header">
                                        <h:outputText value="-" />
                                    </f:facet>
                                    <p:column style="text-align: right">
                                        <f:facet name="header">
                                            <h:outputText value="Atributo" />
                                        </f:facet>
                                        <h:outputText value="#{u.nombre}" />
                                    </p:column>
                                </p:dataTable>
                            </p:column>
                            <p:column>
                                <p:dataTable value="#{bd.obj.costoAtributoxSitio}" var="x">
                                    <f:facet name="header">
                                        <h:outputText value="Costo de atributos por sitios"/>
                                    </f:facet>
                                    <p:columns value="#{bd.obj.sitios}" var="col">
                                        <f:facet name="header">
                                            <h:outputText value="#{col}"/>
                                        </f:facet>
                                        <h:outputText value="#{x.get(col)}" />
                                    </p:columns>
                                </p:dataTable>
                            </p:column>
                        </p:row>
                    </p:panelGrid>


                </p:tab>
                <p:tab title="Esquema">
                    <p:dataTable value="#{bd.obj.esquemaVertical}" var="t">
                        <p:column headerText="Nombre de Frag.">
                            <h:outputText value="#{t.nombre}" />
                        </p:column>
                        <p:column headerText="Sitio">
                            <h:outputText value="#{t.sitio}" />
                        </p:column>
                        <p:column headerText="Atributos">
                            <h:outputText value="#{t.atributosxComa}" />
                        </p:column>
                        <p:column headerText="Costo">
                            <h:outputText value="#{t.costo}" />
                        </p:column>
                    </p:dataTable>

                    <p:progressBar widgetVar="pbAjax" ajax="true" value="#{bd.obj.progress1}" labelTemplate="{value}%" styleClass="animated" global="false">
                        <p:ajax event="complete" listener="#{bd.onComplete}" update="f8:growl" oncomplete="PF('startButton2').enable()"/>
                    </p:progressBar>
                    <br/>
                    <p:commandButton widgetVar="startButton2" value="Let's do it" onclick="PF('pbAjax').start();PF('startButton2').disable();" action="#{bd.fragEstatica()}" update="f8:growl" />
                    <p:dialog id="d6" visible="#{bd.BToken}" header="Token">
                        <h:outputText value="Dynamic fragmentation of this kind requires to be implemented in Java with the download files and to use this token" /><br />
                        <p:inputText readonly="true" value="#{bd.obj.tabla.idTabla}" />
                    </p:dialog>
                </p:tab>
            </p:tabView>
        </h:form>
    </h:body>
</html>
