<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Xamana</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <h:outputStylesheet name="jquery-ui.css"/>
        <h:outputStylesheet name="jquery-ui.theme.css"/>
        <h:outputStylesheet name="jquery-ui.theme.min.css"/>
        <h:outputStylesheet name="jquery-ui.min.css"/>
        <h:outputStylesheet name="jquery-ui.structure.css"/>
        <h:outputStylesheet name="jquery-ui.structure.min.css"/>
        <h:outputStylesheet name="style.css"/>
        <script type="text/javascript">
            //<![CDATA[
            function start2() {
                PF('statusDialog').show();
            }

            function stop2() {
                PF('statusDialog').hide();
            }
            function start() {
                PF('startButton1').disable();

                window['progress'] = setInterval(function () {
                    var pbClient = PF('pbClient'),
                            oldValue = pbClient.getValue(),
                            newValue = oldValue + 10;

                    pbClient.setValue(pbClient.getValue() + 10);

                    if (newValue === 100) {
                        clearInterval(window['progress']);
                    }


                }, 1000);
            }

            function cancel() {
                clearInterval(window['progress']);
                PF('pbClient').setValue(0);
                PF('startButton1').enable();
            }
            //]]>
        </script>
    </h:head>
    <h:body style="background-color: #3f3f3f">
        <header>
            <text>Scheme</text>
        </header>
        <h:form id="f8">
            <p:growl id="growl" showDetail="true"/>
            <p:cascadeSelect id="pull" value="#{bd.AAgregar}" placeholder="Atributos disponibles" converter="convertidor">
                <p:ajax event="itemSelect" listener="#{bd.onItemSelect}" update="growl pull f8:tprincipal:mitabla f8:tprincipal" />
                <f:selectItems value="#{bd.pull}"/>
            </p:cascadeSelect>
            <br />
            <br />
            <p:dataTable id="tprincipal" value="#{bd.obj.esquemaVertical}" var="t">
                <p:column headerText="Nombre de Frag.">
                    <h:outputText value="#{t.nombre}" />
                </p:column>
                <p:column headerText="Sitio">
                    <h:outputText value="#{t.sitio}" />
                </p:column>
                <p:column headerText="Atributos (selecciona para eliminar)">
                    <p:dataTable id="mitabla" value="#{t.arrAtri}" var="u" styleClass="style">
                        <p:column headerText="Atributos de #{t.nombre}">
                            <p:commandButton value="#{u.nombre}" action="#{bd.onClose(u,t)}" ajax="true" update="mitabla f8:tprincipal f8:growl f8:pull"/>
                        </p:column>
                    </p:dataTable>
                </p:column>
                <p:column headerText="Costo">
                    <h:outputText value="#{t.costo}" />
                </p:column>
            </p:dataTable>

            <p:progressBar widgetVar="pbAjax" ajax="true" value="#{bd.obj.progress1}" labelTemplate="{value}%" styleClass="animated" global="false">
                <p:ajax event="complete" listener="#{bd.onComplete}" update="f8:growl" oncomplete="PF('startButton2').enable()"/>
            </p:progressBar>
            <br/>
            <p:commandButton widgetVar="startButton2" value="Let's do it" onclick="PF('pbAjax').start();PF('startButton2').disable();" action="#{bd.fragEstatica()}" update="f8:growl f8:f6" />
            <p:dialog id="d6" visible="#{bd.BToken}" header="Token">
                <h:outputText value="Dynamic fragmentation of this kind requires to be implemented in Java with the download files and to use this token" /><br />
                <p:inputText readonly="true" value="#{bd.obj.tabla.idTabla}" />
            </p:dialog>

        </h:form>
    </h:body>
</html>
