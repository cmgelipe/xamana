<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">
    <h:head>
        <title>Xamana</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <h:outputStylesheet name="jquery-ui.css"/>
        <h:outputStylesheet name="jquery-ui.theme.css"/>
        <h:outputStylesheet name="jquery-ui.theme.min.css"/>
        <h:outputStylesheet name="jquery-ui.min.css"/>
        <h:outputStylesheet name="jquery-ui.structure.css"/>
        <h:outputStylesheet name="jquery-ui.structure.min.css"/>
        <h:outputStylesheet name="style.css"/>
        <script type="text/javascript">
            //<![CDATA[
            function start2() {
                PF('statusDialog').show();
            }

            function stop2() {
                PF('statusDialog').hide();
            }
            function start() {
                PF('startButton1').disable();

                window['progress'] = setInterval(function () {
                    var pbClient = PF('pbClient'),
                            oldValue = pbClient.getValue(),
                            newValue = oldValue + 10;

                    pbClient.setValue(pbClient.getValue() + 10);

                    if (newValue === 100) {
                        clearInterval(window['progress']);
                    }


                }, 1000);
            }

            function cancel() {
                clearInterval(window['progress']);
                PF('pbClient').setValue(0);
                PF('startButton1').enable();
            }
            //]]>
        </script>
    </h:head>
    <h:body style="background-color: #3f3f3f">
        <header>
            <text>Scheme</text>
        </header>
        <h:form id="f4">
            <p:growl id="growl" showDetail="true" sticky="true"  />
            <p:dataTable value="#{bd.valoresColumna}" var="t" rendered="#{bd.obj.horizontalCBIR}">
                <p:column headerText="Fragment name">
                    <h:outputText value="#{t.nombre}" />
                </p:column>
                <p:column headerText="Set">
                    <h:outputText value="#{t.valor}" />
                </p:column>
                <p:column headerText="Number of tuples">
                    <h:outputText value="#{t.NTuplas}" />
                </p:column>
                <p:column headerText="Percentages">
                    <h:outputText value="#{t.porcentaje}" />
                </p:column>
                <p:column headerText="Operations value">
                    <h:outputText value="#{t.NOperacionesAprox}" />
                </p:column>
                <p:column headerText="Performance value">
                    <h:outputText value="#{t.ndesempenio}" />
                </p:column>
            </p:dataTable>
            <p:progressBar widgetVar="pbAjax" ajax="true" value="#{bd.obj.progress1}" labelTemplate="{value}%" styleClass="animated" global="false">
                <p:ajax event="complete" listener="#{bd.onComplete}" update="f4:growl" oncomplete="PF('startButton2').enable()"/>
            </p:progressBar>
            <p:commandButton widgetVar="startButton2" value="Let's do it" onclick="PF('pbAjax').start();PF('startButton2').disable();" action="#{bd.fragEstatica()}" update="f4:growl f4:d6" />
            <p:commandButton value="Download files" ajax="false" onclick="PrimeFaces.monitorDownload(start2, stop2);" icon="pi pi-arrow-down" >
                <p:fileDownload value="#{bd.descarga}" />
            </p:commandButton>
            <p:dialog id="d5" header="Information" visible="#{bd.infoEsquema1}" modal="true" closable="false">
                <h:outputText value="The first design of the proposed scheme is shown, when applying it, all the corresponding files must be downloaded to apply"/><br />
                <h:outputText value="dynamic fragmentation. The download is accompanied by a file with the instructions to follow." /><br />
                <p:commandButton value="OK" action="#{bd.setInfoEsquema1(false)}" update="f4:d5" />
            </p:dialog>
            <p:dialog id="d6" visible="#{bd.BToken}" header="Token">
                <h:outputText value="Dynamic fragmentation of this kind requires to be implemented in Java with the download files and to use this token" /><br />
                <p:inputText readonly="true" value="#{bd.obj.tabla.idTabla}" />
            </p:dialog>
        </h:form>
    </h:body>
</html>
